<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de prueba Resend — Espacio Timbó</title>
  <style>
    body { font-family: Inter, sans-serif; background: #f6f1e8; color: #2f3a2f; margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
    .card { width: min(720px, 100%); background: white; border-radius: 16px; box-shadow: 0 18px 55px rgba(0,0,0,0.08); padding: 2.5rem; }
    h1 { margin: 0 0 1rem; font-size: clamp(1.8rem, 2.5vw, 2.4rem); }
    p { margin: 0 0 1.5rem; color: #5b645d; max-width: 44rem; }
    .form-grid { display: grid; gap: 1.25rem; }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #3e4a3d; }
    input, textarea, select { width: 100%; border: 1px solid #d4c9b6; border-radius: 10px; padding: 0.95rem 1rem; font-size: 1rem; color: #2f3a2f; background: #fff; }
    textarea { min-height: 160px; resize: vertical; }
    button { border: none; background: #8b6b47; color: white; padding: 0.95rem 1.4rem; font-size: 0.95rem; border-radius: 10px; cursor: pointer; transition: background 0.2s ease; }
    button:hover { background: #705339; }
    .note { margin-top: 1rem; color: #6e7567; font-size: 0.95rem; }
    .message { margin-top: 1rem; padding: 1rem 1.2rem; border-radius: 10px; background: #eef6ea; color: #2f4b2f; display: none; }
    .message.error { background: #f8e4e2; color: #7a2822; }
    .field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Formulario de prueba con Resend</h1>
    <p>Usá este ejemplo para enviar un correo de prueba a través de una función Netlify que usa la API de Resend. Asegurate de tener la variable de entorno <code>RESEND_API_KEY</code> configurada.</p>

    <form id="resend-form">
      <div class="form-grid">
        <div class="field-row">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo">
        </div>
        <div class="field-row">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" required placeholder="tu@correo.com">
        </div>
        <div class="field-row">
          <label for="asunto">Asunto</label>
          <input type="text" id="asunto" name="asunto" placeholder="Consulta de prueba" value="Prueba Resend desde Espacio Timbó">
        </div>
        <div class="field-row">
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria">
            <option value="Reserva">Reserva</option>
            <option value="Consulta">Consulta</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div>
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" required placeholder="Escribí tu mensaje aquí..."></textarea>
        </div>
      </div>
      <button type="submit">Enviar correo de prueba</button>
      <p class="note">El correo se enviará desde Resend hacia la dirección configurada en la función.</p>
      <div id="resultado" class="message"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('resend-form');
    const mensajeEl = document.getElementById('resultado');

    form.addEventListener('submit', async function(event) {
      event.preventDefault();
      mensajeEl.style.display = 'none';
      mensajeEl.classList.remove('error');
      mensajeEl.textContent = '';

      const data = {
        nombre: form.nombre.value.trim(),
        email: form.email.value.trim(),
        asunto: form.asunto.value.trim(),
        categoria: form.categoria.value,
        mensaje: form.mensaje.value.trim(),
      };

      try {
        const response = await fetch('/.netlify/functions/resend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Error desconocido');

        mensajeEl.textContent = 'Correo enviado correctamente. Verifica el buzón de destino o la consola de Netlify si usás un entorno de prueba.';
        mensajeEl.style.display = 'block';
        form.reset();
      } catch (error) {
        mensajeEl.textContent = 'Error al enviar: ' + error.message;
        mensajeEl.classList.add('error');
        mensajeEl.style.display = 'block';
        console.error(error);
      }
    });
  </script>
</body>
</html>
